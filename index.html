<style>
:root{
  color-scheme:light;
  --noite:#12264A; --noite2:#1D3866; --coral:#E8552D; --coral-esc:#B93C18; --ouro:#F4B740; --ouro-claro:#FFF0C9;
  --papel:#FFF8EE; --branco:#FFFFFF; --tinta:#1B2433; --suave:#5B6678; --linha:#E8DFD0; --mar:#0B7A6F; --mar-claro:#DDF3EF;
  --erro:#B3261E; --sombra:0 8px 24px rgba(18,38,74,.10);
  --titulo:"Bricolage Grotesque",Georgia,serif; --texto:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 16px/1.45 var(--texto);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.sem-nav{padding-bottom:0}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.demo{background:var(--ouro);color:var(--noite);font-weight:800;font-size:14px;text-align:center;padding:7px 12px}
header.topo{background:var(--noite);color:#fff;padding:22px 0 26px}
.topo .sup{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ouro)}
.topo h1{font-size:36px;font-weight:800;margin-top:4px}
.topo .linha{display:flex;gap:10px;margin-top:18px}
.num{flex:1;background:var(--noite2);border-radius:14px;padding:11px 12px;min-width:0}
.num b{display:block;font:800 25px/1.1 var(--titulo)}
.num span{font-size:13px;color:#CDD8EA}
main.wrap{padding-top:22px}
.bloco{margin-bottom:24px}
.bloco>h2{font-size:22px;margin-bottom:11px}
.nota{font-size:14px;color:var(--suave)}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:18px;box-shadow:var(--sombra);padding:16px}
.rota{display:flex;flex-direction:column;gap:17px}
.rota-item .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800}
.rota-item .cab b{font:800 19px var(--titulo);color:var(--coral-esc)}
.trilho{position:relative;height:30px;margin:4px 14px 0}
.trilho:before{content:"";position:absolute;left:-14px;right:-14px;top:14px;border-top:3px dashed #CFD6E2}
.feito{position:absolute;left:-14px;top:13px;height:5px;background:var(--coral);border-radius:3px}
.aviao{position:absolute;top:2px;width:28px;height:28px;margin-left:-14px;color:var(--noite)}
.pontos{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--suave);margin-top:9px}
.passes{display:grid;gap:12px}
.passe{background:var(--branco);border:1px solid var(--linha);border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.passe .alto{display:flex;justify-content:space-between;gap:10px;background:var(--noite);color:#fff;padding:11px 14px}
.passe .alto strong{font:800 17px var(--titulo)}
.passe .alto span{white-space:nowrap;font-weight:800;color:var(--ouro)}
.passe .corpo{padding:12px 14px}
.medalhas{display:flex;flex-wrap:wrap;gap:6px}
.medalha{display:inline-flex;align-items:center;gap:5px;background:var(--ouro-claro);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.vazio{font-size:14px;color:var(--suave)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.feed li:last-child{border:0}
.feed .quando{margin-left:auto;font-size:13px;color:var(--suave);white-space:nowrap}
.tabela{width:100%;border-collapse:collapse;font-size:15px}
.tabela th{font-size:13px;color:var(--suave);text-align:center;padding:6px 4px}
.tabela th:first-child{text-align:left}
.tabela td{padding:10px 4px;border-top:1px solid var(--linha);text-align:center}
.tabela td:first-child{text-align:left;font-weight:700}
.tabela.hist{font-size:14px}
.tabela.hist th,.tabela.hist td{text-align:right;white-space:nowrap;padding-left:6px;padding-right:0}
.tabela.hist th:first-child,.tabela.hist td:first-child{text-align:left;padding-left:0}
.dia{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--linha)}
.dia:first-child{border-top:0;padding-top:0}
.dia:last-child{padding-bottom:0}
.dia .data{font-weight:800;line-height:1.2}
.dia .data small{display:block;font-size:13px;font-weight:700;color:var(--suave)}
.dia .prog{font-weight:800}
.dia p{margin:3px 0 0;font-size:15px;color:var(--suave)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;margin-top:6px}
.tag.parque{background:#FBE3DB;color:#8E2D10}
.tag.descanso{background:var(--mar-claro);color:#075A52}
.tag.voo{background:#E3E9F4;color:var(--noite)}
.fato{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--linha)}
.fato:first-child{border-top:0;padding-top:0}
.fato:last-child{padding-bottom:0}
.fato span{color:var(--suave)}
.fato b{text-align:right}
.lista{margin:0;padding:0;list-style:none}
.lista li{padding:11px 0;border-top:1px solid var(--linha)}
.lista li:first-child{border-top:0;padding-top:0}
.lista li:last-child{padding-bottom:0}
.lista b{display:block}
.tabela.comp th,.tabela.comp td{text-align:right;padding:8px 0 8px 10px}
.tabela.comp th:first-child,.tabela.comp td:first-child{text-align:left;padding-left:0;white-space:normal}
.tabela.comp tbody th{font-size:15px;font-weight:800;color:var(--tinta)}
.tabela.comp .grupo td{font-weight:800}
.tabela.comp .sub td{border-top:0;padding-top:0;font-weight:400;font-size:14px;color:var(--suave)}
.tabela.comp .sub td:first-child{font-weight:400;padding-left:10px}
.tabela.comp .total th,.tabela.comp .total td{border-top:2px solid var(--noite);font-size:17px;font-weight:800;color:var(--tinta)}
.guia{margin-bottom:14px}
.guia .alvo{font:800 34px/1.1 var(--titulo);color:var(--coral-esc);margin:10px 0 4px}
.guia .alvo small{font:700 16px var(--texto);color:var(--suave)}
.guia .fato:first-of-type{border-top:1px solid var(--linha);padding-top:9px;margin-top:10px}
.guia .fato:last-of-type{padding-bottom:9px}
.guia .alt{background:var(--mar-claro);border-radius:12px;padding:11px 12px;font-size:15px;margin:10px 0}
.sub-t{font-size:18px;margin-top:20px}
.prog-l{display:grid;grid-template-columns:1fr 112px;gap:9px;align-items:end}
.prog-l label{margin-top:12px;font-size:15px}
.calc{background:#FBF5EA;border-radius:12px;padding:12px;margin-top:14px}
.calc .fato{border-top:0;padding:0 0 8px}
.prog-t{font-size:14px}
.prog-t th,.prog-t td{text-align:right;padding:8px 0 8px 8px}
.prog-t th:first-child,.prog-t td:first-child{text-align:left;padding-left:0}
.alerta{background:var(--ouro-claro);border-radius:10px;padding:9px 11px;font-size:14px;font-weight:700;margin:10px 0 0}
.tabela.hist .det-prog td{border-top:0;padding:0 0 9px;text-align:left;white-space:normal;font-size:13px;font-weight:400;color:var(--suave)}
.pacotes{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.pacotes thead th{font:800 12px var(--texto);background:var(--noite);color:#fff;padding:9px 1px;text-align:center;border-left:1px solid #fff;letter-spacing:-.01em}
.pacotes thead th.ativo{background:var(--coral-esc)}
.pacotes thead small{display:block;font:700 11px var(--texto)}
.pacotes tbody th{text-align:left;font-size:13px;color:var(--suave);padding:12px 0 4px;font-weight:800}
.pacotes td{text-align:center;vertical-align:top;padding:8px 4px;background:#F6F1E7;border-left:2px solid #fff;overflow-wrap:break-word}
.pacotes td.dif{background:var(--ouro-claro);font-weight:800}
.pacotes .tot td{font-weight:800}
.ganhos{display:grid;gap:14px;margin-top:12px}
.ganhos h3{font-size:17px}
.ganhos ul{margin:6px 0 0;padding-left:20px}
.ganhos li{margin-top:3px}
.ok{color:var(--mar);font-weight:800}
.nao{color:#98A1B0}
.marco{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;border-top:1px solid var(--linha);padding:12px 0;text-align:left}
.marco:first-child{border-top:0}
.caixa{flex:none;width:26px;height:26px;border:2px solid #A9B2C2;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;margin-top:1px}
.on>.caixa,.caixa.on{background:var(--mar);border-color:var(--mar)}
.marco small{display:block;color:var(--suave);font-size:14px}
.marco.on span.t{text-decoration:line-through;color:var(--suave)}
label{display:block;font-weight:800;margin:14px 0 5px}
input[type=text],input[type=password],input[inputmode],select{width:100%;min-height:48px;background:#fff;border:1.5px solid #C9C2B5;border-radius:12px;padding:10px 12px;font-size:17px}
select{font-size:16px!important;padding-left:8px!important;padding-right:4px!important}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;border:0;border-radius:13px;background:var(--coral-esc);color:#fff;font-weight:800;padding:10px 18px}
.btn.claro{background:transparent;color:var(--noite);border:1.5px solid var(--noite)}
.btn.link{background:none;color:var(--coral-esc);padding:8px 0;min-height:44px;text-decoration:underline}
.btn.bloco-w{width:100%;margin-top:16px}
.btn:disabled{opacity:.55;cursor:default}
.erro{color:var(--erro);font-weight:700;margin-top:10px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opc{min-height:62px;background:#fff;border:1.5px solid #C9C2B5;border-radius:14px;padding:10px;font-weight:800;text-align:left}
.resumo{background:var(--noite);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.resumo .gr{font:800 42px/1 var(--titulo);color:var(--ouro)}
.barra{height:12px;border-radius:7px;background:#3A5381;overflow:hidden;margin:12px 0}
.barra i{display:block;height:100%;background:var(--ouro)}
.resumo .det{font-size:15px;color:#DCE4F1}
.check{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;background:none;border:0;padding:6px 0;text-align:left;font-weight:600}
.pessoa{font-weight:800;margin-top:12px}
.entrada{min-height:100vh;display:flex;align-items:center;background:var(--noite);padding:24px 0}
.entrada .card{width:100%}
.entrada h1{font-size:36px;font-weight:800;color:var(--noite)}
.entrada .sup{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-esc)}
nav.abas{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.abas button{flex:1;min-width:0;max-width:200px;min-height:62px;padding:0 2px;background:none;border:0;font-size:13px;font-weight:800;color:var(--suave);border-top:3px solid transparent}
nav.abas button[aria-current=page]{color:var(--coral-esc);border-top-color:var(--coral-esc)}
nav.abas .ic{display:block;font-size:20px;line-height:1.2}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--noite);color:#fff;border-radius:14px;padding:13px 15px;font-weight:700;box-shadow:var(--sombra);z-index:9}
.rodape{text-align:center;font-size:12px;color:var(--suave);padding:6px 0 18px}
.acoes{display:flex;gap:9px;flex-wrap:wrap}
.confete{position:fixed;top:-20px;width:9px;height:14px;z-index:20;pointer-events:none;animation:cai 1.7s ease-in forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.75}}
@media (prefers-reduced-motion:reduce){.confete{display:none}}
@media (max-width:370px){.topo h1,.entrada h1{font-size:31px}.num b{font-size:21px}nav.abas button{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ================= CONFIGURAÇÃO ================= */
var BUILD = "2026-11-05j";
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBT5_QhfJwfFpKUbw9e3O7-mtqAl1zicCg",
  authDomain: "orlando-2029.firebaseapp.com",
  projectId: "orlando-2029",
  storageBucket: "orlando-2029.firebasestorage.app",
  messagingSenderId: "785541654636",
  appId: "1:785541654636:web:759a9c726e01c80136d049"
};
var DEMO = FIREBASE_CONFIG.apiKey === "COLE_AQUI";

var DATA_VIAGEM = new Date(2029, 3, 21, 12, 0, 0);
var FIM_RESERVA = new Date(2029, 2, 31, 12, 0, 0);
var COTACAO_PADRAO = 5.5;
var PASSAGEM_USD = 952;      /* passagem intermediária com 12% de folga */
var MILHAS_POR_PASSAGEM = 120000;

/* Metas estimadas em dólares, com 12% de folga. Hotel: French Quarter ou Beach Club + Cabana Bay. */
function pacotes(e,i,l,d9,d7){return [{id:"econ",nome:"Econômica",usd:e},{id:"inter",nome:"Intermediária",usd:i},{id:"luxo",nome:"Deluxe",usd:l},{id:"disney9",nome:"Só Disney, 9 noites",usd:d9},{id:"disney7",nome:"Só Disney, 7 noites",usd:d7}]}
var NUCLEOS = [
  {id:"tarcisio", nome:"Tarcísio e Aline", sub:"com Lucas e Clara", pessoas:["Tarcísio","Aline","Lucas","Clara"], planos:pacotes(19000,24200,28000,15000,13100)},
  {id:"beth", nome:"Beth", sub:"inclui quarto com Lucas e carrinho", pessoas:["Beth"], planos:pacotes(7700,10200,13900,5800,4900)},
  {id:"paulo", nome:"Paulo e Marisia", sub:"", pessoas:["Paulo","Marisia"], planos:pacotes(11100,14500,18200,8600,7400)},
  {id:"geraldo", nome:"Bruna e Geraldo", sub:"", pessoas:["Bruna","Geraldo"], planos:pacotes(11100,14500,18200,8600,7400)}
];

/* Composição das metas, em dólares a preços atuais. A folga é a diferença até a meta. */
var POR_PESSOA = {pass:850,transp:144,disney:630,univ:360,sea:99,filas:200,comida:1170,seguro:100,doc:233,compras:556};
var HOTEL = {econ:{hd:1980,hu:840},inter:{hd:3410,hu:840},luxo:{hd:6750,hu:840}};
var SO_DISNEY = {
  disney9:{hd:1980,nHd:"Hotel em Disney Springs, 9 noites",transp:100,disney:630,filas:200,comida:600,seguro:100,dias:10,dCarr:5},
  disney7:{hd:1540,nHd:"Hotel em Disney Springs, 7 noites",transp:82,disney:500,filas:160,comida:480,seguro:80,dias:8,dCarr:4}
};
function valoresComp(n,pid){
  var q=n.pessoas.length,P=POR_PESSOA,b=n.id==="beth",d=SO_DISNEY[pid];
  if(d)return {pass:P.pass*q,transp:d.transp*q,hd:d.hd,nHd:d.nHd,hu:0,disney:d.disney*q,univ:0,sea:0,filas:d.filas*q,comida:d.comida*q,seguro:d.seguro*q,doc:P.doc*q,compras:150*q,carrinho:b?d.dCarr*65:0,dCarr:d.dCarr,dias:d.dias};
  var h=HOTEL[HOTEL[pid]?pid:"inter"],ec=pid==="econ";
  return {pass:P.pass*q,transp:P.transp*q,hd:h.hd,nHd:pid==="luxo"?"Beach Club, 9 noites":(ec?"Hotel em Disney Springs, 9 noites":"French Quarter, 9 noites"),hu:h.hu,nHu:"Cabana Bay, 3 noites",
    disney:P.disney*q,univ:P.univ*q,sea:P.sea*q,filas:P.filas*q,comida:(ec?780:P.comida)*q,seguro:P.seguro*q,doc:P.doc*q,compras:(ec?150:P.compras)*q,carrinho:b?520:0,dCarr:8,dias:13};
}
function gruposComp(n,pid){
  var c=valoresComp(n,pid),q=n.pessoas.length,pes=q===1?"1 pessoa":q+" pessoas";
  var g=[
    {t:"Passagens",i:[{n:"Ida e volta, "+pes,v:c.pass}]},
    {t:"Hospedagem",i:[{n:c.nHd,v:c.hd},{n:c.nHu,v:c.hu}]},
    {t:"Ingressos",i:[{n:"Parques da Disney",v:c.disney},{n:"Universal, Islands e Epic",v:c.univ},{n:"SeaWorld",v:c.sea}]},
    {t:"Nos parques",i:[{n:"Filas pagas",v:c.filas},{n:"Carrinho elétrico, "+(c.dCarr||8)+" dias",v:c.carrinho||0}]},
    {t:"Alimentação",i:[{n:(c.dias||13)+" dias, "+pes,v:c.comida}]},
    {t:"Transporte em Orlando",i:[{n:"Carros de aplicativo",v:c.transp}]},
    {t:"Documentos e seguro",i:[{n:"Visto e passaporte",v:c.doc},{n:"Seguro-viagem",v:c.seguro}]},
    {t:"Compras e lembranças",i:[{n:"Valor de referência",v:c.compras}]}
  ],r=[],a,b,s;
  for(a=0;a<g.length;a++){s=0;var it=[];for(b=0;b<g[a].i.length;b++)if(g[a].i[b].v>0){it.push(g[a].i[b]);s+=g[a].i[b].v}if(s>0)r.push({t:g[a].t,i:it,s:s})}
  return r;
}
function htmlComp(n,pid){
  var ref=pid==="custom",id=ref?"inter":pid,g=gruposComp(n,id),meta=plano(n,id).usd,sub=0,i,j;
  for(i=0;i<g.length;i++)sub+=g[i].s;
  var h='<table class="tabela comp"><thead><tr><th scope="col">Item</th><th scope="col">US$</th><th scope="col">%</th></tr></thead><tbody>';
  function pc(v){return Math.round(v/meta*100)+"%"}
  for(i=0;i<g.length;i++){
    h+='<tr class="grupo"><th scope="row">'+esc(g[i].t)+'</th><td>'+fmt(g[i].s)+'</td><td>'+pc(g[i].s)+'</td></tr>';
    if(g[i].i.length>1||g[i].t==="Passagens"||g[i].t==="Alimentação")for(j=0;j<g[i].i.length;j++)h+='<tr class="sub"><td>'+esc(g[i].i[j].n)+'</td><td>'+fmt(g[i].i[j].v)+'</td><td></td></tr>';
  }
  h+='<tr class="grupo"><th scope="row">Folga para aumento de preços</th><td>'+fmt(meta-sub)+'</td><td>'+pc(meta-sub)+'</td></tr>';
  h+='<tr class="total"><th scope="row">Total'+(ref?" da Intermediária":"")+'</th><td>'+fmt(meta)+'</td><td>100%</td></tr></tbody></table>';
  if(ref)h+='<p class="nota">Vocês definiram outro valor. A tabela mostra a Intermediária como referência.</p>';
  if(n.id==="tarcisio")h+='<p class="nota">Inclui Lucas e Clara. O hotel daqui é o quarto de vocês com a Clara; o quarto do Lucas está na meta da Beth.</p>';

function deepMerge(a,b){
  var r={},k;
  for(k in a){if(Object.prototype.hasOwnProperty.call(a,k))r[k]=a[k]}
  for(k in b){
    if(!Object.prototype.hasOwnProperty.call(b,k))continue;
    if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&r[k]&&typeof r[k]==="object"&&!Array.isArray(r[k]))r[k]=deepMerge(r[k],b[k]);
    else r[k]=b[k];
  }
  return r;
}

function sha256(txt){
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)).then(function(b){
      var a=new Uint8Array(b),s="",i;for(i=0;i<a.length;i++)s+=("0"+a[i].toString(16)).slice(-2);return s;
    });
  }
  if(DEMO){var h=0,i2;for(i2=0;i2<txt.length;i2++)h=(h*31+txt.charCodeAt(i2))|0;var u=(h>>>0).toString(16),r="";while(r.length<64)r+=u;return Promise.resolve(r.slice(0,64))}
  return Promise.reject(new Error("sem-crypto"));
}
function parseNum(v){
  var s=String(v==null?"":v).replace(/[^\d,.]/g,"");
  if(!s)return 0;
  var temV=s.indexOf(",")>=0;
  if(temV)s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  var n=parseFloat(s);
  return isFinite(n)&&n>=0?n:0;
}
function fmt(n,d){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function usd(n){return "US$ "+fmt(Math.round(n))}
function brl(n){return "R$ "+fmt(Math.round(n))}
function mesAtual(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
function diasAte(d){return Math.max(0,Math.ceil((d.getTime()-Date.now())/86400000))}
function mesesAte(d){var a=new Date();return Math.max(0,(d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth()+1)} /* inclui o mês atual */
function nucleo(id){var i;for(i=0;i<NUCLEOS.length;i++)if(NUCLEOS[i].id===id)return NUCLEOS[i];return null}
function plano(n,id){var i;for(i=0;i<n.planos.length;i++)if(n.planos[i].id===id)return n.planos[i];for(i=0;i<n.planos.length;i++)if(n.planos[i].id==="inter")return n.planos[i];return n.planos[0]}
function planoDeluxe(n){return plano(n,"luxo")}
function clampPct(x){x=Number(x);if(!isFinite(x)||x<0)return 0;return Math.min(100,Math.round(x))}
function quando(ms){
  var d=Math.floor((Date.now()-Number(ms))/86400000);
  if(!isFinite(d)||d<0)return "";
  if(d===0)return "hoje"; if(d===1)return "ontem"; if(d<31)return "há "+d+" dias";
  return new Date(Number(ms)).toLocaleDateString("pt-BR",{month:"short",year:"numeric"});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* Valor da reserva em dólares. Milhas só contam até cobrir as passagens do núcleo. */
function equivalente(n,v,cot){
  var mil=Number(v.milhas||0)*(PASSAGEM_USD/MILHAS_POR_PASSAGEM);
  var teto=n.pessoas.length*PASSAGEM_USD;
  var milUsd=Math.min(mil,teto);
  return {usd:Number(v.usd||0),brlUsd:Number(v.brl||0)/(cot||COTACAO_PADRAO),milUsd:milUsd,teto:teto,total:Number(v.usd||0)+Number(v.brl||0)/(cot||COTACAO_PADRAO)+milUsd};
}
function sequenciaMeses(l){
  if(!l||!l.length)return 0;
  var a=l.slice().sort(),c=1,i;
  for(i=a.length-1;i>0;i--){
    var x=a[i].split("-"),y=a[i-1].split("-");
    var dif=(Number(x[0])-Number(y[0]))*12+Number(x[1])-Number(y[1]);
    if(dif===1)c++;else if(dif!==0)break;
  }
  return c;
}
function docsFeitos(n,docs){
  var c=0,i,p;docs=docs||{};
  for(i=0;i<n.pessoas.length;i++){p=docs[n.pessoas[i]]||{};if(p.p===true)c++;if(p.v===true)c++}
  return c;
}
function todos(n,docs,campo){var i,p;docs=docs||{};for(i=0;i<n.pessoas.length;i++){p=docs[n.pessoas[i]]||{};if(p[campo]!==true)return false}return true}
function calcular(n,pub,novo){
  /* novo: {pct,total,milhas} — devolve o documento público atualizado sem valores */
  var pct=clampPct(novo.pct),docs=novo.docs||pub.docs||{},meses=novo.meses||pub.meses||[];
  var med={},k;var ant=pub.medalhas||{};for(k in ant)if(MEDALHAS[k])med[k]=ant[k];
  var t=Date.now(),seq=sequenciaMeses(meses);
  function gan(id,c){if(c&&!med[id])med[id]=t}
  gan("inicio",pct>0);gan("p10",pct>=10);gan("p25",pct>=25);gan("p50",pct>=50);gan("p75",pct>=75);gan("p100",pct>=100);
  gan("deluxe",novo.deluxe===true);gan("milhas",novo.temMilhas===true);
  gan("passaporte",todos(n,docs,"p"));gan("visto",todos(n,docs,"v"));
  gan("m3",seq>=3);gan("m6",seq>=6);gan("m12",seq>=12);
  var pts=pct*10+docsFeitos(n,docs)*100+meses.length*50;
  return {pct:pct,pts:pts,medalhas:med,meses:meses,docs:docs,atualizadoEm:t};
}

function parseVenc(t){

}

function htmlCalcMilhas(n,pr,f,ve){

    h+='</div></section>';return h;
  }
  var n=nucleo(S.fNucleo),tem=!!((S.prog[n.id]||{}).pinTag);
  h+='<div class="card"><h2>'+esc(n.nome)+'</h2><p>'+(tem?"Digite o PIN de vocês.":"Crie um PIN de 4 números. Ele protege os valores de vocês e será pedido em cada aparelho novo.")+'</p>';
  h+='<label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" maxlength="4" autocomplete="off">';
  if(!tem){h+='<label for="pin2">Repita o PIN</label><input type="password" id="pin2" inputmode="numeric" maxlength="4" autocomplete="off">'}
  if(S.erro)h+='<div class="erro" role="alert">'+esc(S.erro)+'</div>';
  h+='<button class="btn bloco-w" data-a="pin"'+(S.ocupado?" disabled":"")+'>'+(tem?"Entrar":"Criar PIN")+'</button>';
  h+='<div class="acoes" style="justify-content:space-between;margin-top:6px"><button class="btn link" data-a="volta-n">Voltar</button>'+(tem?'<button class="btn link" data-a="esqueci">Esqueci o PIN</button>':"")+'</div></div></section>';
  return h;
}
function render(){
  var el=document.getElementById("app"),h="";
  if(DEMO&&S.tela!=="entrada")h+='<div class="demo">Modo demonstração: dados fictícios, nada é salvo na nuvem</div>';
  if(S.tela==="entrada"){h+=telaEntrada();document.body.className="sem-nav"}
  else if(S.tela==="carregando"){h+=telaCarregando();document.body.className="sem-nav"}
  else{
    document.body.className="";
    h+=cabecalho()+'<main class="wrap">';
    if(S.aba==="painel")h+=abaPainel();else if(S.aba==="viagem")h+=abaViagem();else if(S.aba==="prep")h+=abaPreparativos();else h+=abaNucleo();
    h+='<div class="rodape">Versão '+BUILD+'</div></main>';
    h+='<nav class="abas" aria-label="Seções">'+btAba("painel","🛫","Painel")+btAba("viagem","🗺️","A viagem")+btAba("prep","✅","Preparativos")+btAba("nucleo","💰","Meu núcleo")+'</nav>';
    if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  }
  /* Mantém o que foi digitado e ainda não salvo quando a tela é redesenhada. */
  var rascunho={},campos=el.querySelectorAll('input[id^="f-"],select[id^="f-"]'),ci,temR=false;
  for(ci=0;ci<campos.length;ci++){rascunho[campos[ci].id]=campos[ci].value;temR=true}
  el.innerHTML=h;
  if(temR){
    var rk,re,achou=false;
    for(rk in rascunho){re=document.getElementById(rk);if(re){re.value=rascunho[rk];achou=true}}
    if(achou){
      var sp=document.getElementById("f-plano"),wc=document.getElementById("wrap-custom"),cpc=document.getElementById("comp");
      if(sp&&wc)wc.style.display=sp.value==="custom"?"block":"none";
      if(sp&&cpc&&S.sess)cpc.innerHTML=htmlComp(nucleo(S.sess.n),sp.value);
      var pkc=document.getElementById("pacotes");if(sp&&pkc&&S.sess)pkc.innerHTML=htmlPacotes(nucleo(S.sess.n),sp.value);
      atualizarGuia();
    }
  }
}
function btAba(id,ic,t){return '<button data-a="aba" data-id="'+id+'"'+(S.aba===id?' aria-current="page"':"")+'><span class="ic" aria-hidden="true">'+ic+'</span>'+t+'</button>'}
function digitando(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")}
function renderSeguro(){if(!digitando())render()}
var tmToast;
function aviso(t){S.toast=t;render();clearTimeout(tmToast);tmToast=setTimeout(function(){S.toast="";renderSeguro()},4200)}
function confete(){
  var c=["#E8552D","#F4B740","#0B7A6F","#1D3866"],i;
  for(i=0;i<36;i++){(function(i){var e=document.createElement("div");e.className="confete";e.style.left=Math.random()*100+"vw";e.style.background=c[i%4];e.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},2500)})(i)}
}

/* ================= AÇÕES ================= */
function erroRede(e){
  if(e&&e.message==="sem-firebase")return "Não consegui falar com o servidor agora. Verifique a conexão e recarregue a página.";
  if(e&&e.code==="permission-denied")return "O servidor recusou o acesso. Avise o Tarcísio.";
  return "Não consegui concluir agora. Verifique a conexão e tente de novo.";
}
function normalizarCodigo(c){return String(c||"").trim().toUpperCase().replace(/\s+/g,"")}
function entrar(cod,auto){
  cod=normalizarCodigo(cod);S.codigo=cod;S.criar=false;S.erro="";
  if(cod.length<8){S.erro="O código tem pelo menos 8 caracteres.";S.tela="entrada";render();return}
  S.ocupado=true;render();
  sha256("orlando2029|"+cod).then(function(k){
    S.chave=k;
    return Store.conectar(k).then(function(){return Store.lerConfig()});
  }).then(function(c){
    S.ocupado=false;
    if(!c){S.erro="Não encontrei um painel com esse código. Confira se digitou certo.";S.criar=true;S.tela="entrada";render();return}
    abrir();
  }).catch(function(e){S.ocupado=false;S.tela="entrada";S.erro=erroRede(e);render()});
}
function abrir(){
  lsSet("orl_cod",S.codigo);
  S.tela="carregando";render();
  var timer=setTimeout(function(){
    if(S.tela==="carregando"){var i=document.getElementById("load-info");if(i)i.innerHTML='Está demorando mais que o normal. <button class="btn claro" data-a="recarregar">Recarregar</button>'}
  },10000);
  var ouvindo=false;
  function pronto(){
    if(S.ok.cfg&&S.ok.prog&&S.tela==="carregando"){clearTimeout(timer);S.tela="app";
      var r=lsGet("orl_sess_"+S.chave);
      if(r&&!ouvindo){ouvindo=true;try{var o=JSON.parse(r);if(nucleo(o.n)&&o.k){abrirNucleo(o.n,o.k);return}}catch(e){}}
      render();
    } else if(S.tela==="app")renderSeguro();
  }
  Store.ouvir(function(c){S.cfg=c;S.ok.cfg=true;pronto()},function(p){S.prog=p;S.ok.prog=true;pronto()},function(e){
    clearTimeout(timer);S.tela="entrada";S.erro=erroRede(e);render();
  });
}
function abrirNucleo(id,k){
  S.sess={n:id,k:k};S.plano=null;
  return Store.lerPriv(k).then(function(v){S.priv=v||{};if(S.priv.plano==="enxuta")S.priv.plano="econ";S.plano=S.priv.plano||null;S.fNucleo=null;S.erro="";salvarSessao();render()})
    .catch(function(e){S.sess=null;S.erro=erroRede(e);render()});
}
function tratarPin(){
  var pin=(document.getElementById("pin")||{}).value||"",p2=document.getElementById("pin2");
  var n=S.fNucleo,pub=S.prog[n]||{};
  S.erro="";
  if(!/^\d{4}$/.test(pin)){S.erro="O PIN tem 4 números.";render();return}
  if(p2&&p2.value!==pin){S.erro="Os PINs não são iguais.";render();return}
  S.ocupado=true;render();
  var kPriv,tag;
  sha256(S.chave+"|"+n+"|"+pin+"|privado").then(function(k){kPriv=k;return sha256(S.chave+"|"+n+"|"+pin+"|tag")}).then(function(t){
    tag=t;
    if(pub.pinTag&&pub.pinTag!==tag){S.ocupado=false;S.erro="PIN incorreto.";render();return null}
    if(!pub.pinTag)return Store.gravarProg(n,{pinTag:tag,atualizadoEm:Date.now()}).then(function(){return abrirNucleo(n,kPriv)});
    return abrirNucleo(n,kPriv);
  }).then(function(){S.ocupado=false;render()}).catch(function(e){S.ocupado=false;S.erro=erroRede(e);render()});
}
function salvarValores(){
  var n=nucleo(S.sess.n),pub=S.prog[n.id]||{},cot=(S.cfg&&Number(S.cfg.cotacao))||COTACAO_PADRAO;
  var pid=document.getElementById("f-plano").value;
  var lm=lerMilhasForm();
  if(lm.erroVenc){S.erro="Informe o vencimento como mês e ano, por exemplo 05/2028.";render();return}
  if(!lm.fatorOk){S.erro="Informe quantas milhas valem 1.000 pontos do banco, por exemplo 1.000.";render();return}
  var v={brl:parseNum(document.getElementById("f-brl").value),usd:parseNum(document.getElementById("f-usd").value),milhas:lm.milhas,programas:lm.programas,vencimentos:lm.vencimentos,fator:lm.fator,plano:pid,atualizadoEm:Date.now()};
  var meta;
  if(pid==="custom"){v.metaCustom=Math.round(parseNum(document.getElementById("f-custom").value));if(v.metaCustom<=0){S.erro="Informe a meta em dólares.";render();return}meta=v.metaCustom}
  else{v.metaCustom=0;meta=plano(n,pid).usd}
  /* O mês atual guarda a última atualização; os meses anteriores ficam preservados. */
  v.historico=deepMerge({},(S.priv&&S.priv.historico)||{});
  v.historico[mesAtual()]={brl:v.brl,usd:v.usd,milhas:v.milhas,latam:lm.programas.latam,smiles:lm.programas.smiles,azul:lm.programas.azul,banco:lm.programas.banco};
  var antes=equivalente(n,S.priv||{},cot).total,eq=equivalente(n,v,cot);
  var meses=(pub.meses||[]).slice(),m=mesAtual();
  if(eq.total>antes&&meses.indexOf(m)<0)meses.push(m);
  var novo=calcular(n,pub,{pct:eq.total/meta*100,meses:meses,deluxe:eq.total>=planoDeluxe(n).usd,temMilhas:v.milhas>0});
  var ganhou=[],k;for(k in novo.medalhas)if(!(pub.medalhas||{})[k])ganhou.push(MEDALHAS[k].n);
  S.ocupado=true;S.erro="";render();
  Store.gravarPriv(S.sess.k,v).then(function(){return Store.gravarProg(n.id,novo)}).then(function(){
    S.priv=v;S.plano=pid;S.ocupado=false;
    if(ganhou.length){aviso("Nova medalha: "+ganhou.join(", ")+"!");confete()}else aviso("Salvo!");
  }).catch(function(e){S.ocupado=false;S.erro=erroRede(e);render()});
}
function alternarDoc(p,c){
  var n=nucleo(S.sess.n),pub=S.prog[n.id]||{},docs=deepMerge({},pub.docs||{}),cot=(S.cfg&&Number(S.cfg.cotacao))||COTACAO_PADRAO;
  var x=deepMerge({},docs[p]||{});x[c]=!(x[c]===true);docs[p]=x;
  var eq=equivalente(n,S.priv||{},cot);
  var novo=calcular(n,pub,{pct:pub.pct,docs:docs,deluxe:eq.total>=planoDeluxe(n).usd,temMilhas:Number((S.priv||{}).milhas)>0});
  var ganhou=[],k;for(k in novo.medalhas)if(!(pub.medalhas||{})[k])ganhou.push(MEDALHAS[k].n);
  Store.gravarProg(n.id,novo).then(function(){if(ganhou.length){aviso("Nova medalha: "+ganhou.join(", ")+"!");confete()}}).catch(function(e){aviso(erroRede(e))});
}
function convidar(){
  var url=location.href.split("#")[0]+"#c="+encodeURIComponent(S.codigo);
  var txt="Painel da nossa viagem a Orlando. Abra o link, escolha seu núcleo e crie seu PIN: "+url;
  if(navigator.share){navigator.share({title:"Rumo a Orlando",text:txt}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){aviso("Convite copiado. É só colar no grupo da família.")},function(){aviso(url)})}
  else aviso(url);
}

document.addEventListener("change",function(ev){
  if(ev.target&&ev.target.id==="f-plano"){var w=document.getElementById("wrap-custom");if(w)w.style.display=ev.target.value==="custom"?"block":"none";var cp=document.getElementById("comp");if(cp&&S.sess)cp.innerHTML=htmlComp(nucleo(S.sess.n),ev.target.value);var pk=document.getElementById("pacotes");if(pk&&S.sess)pk.innerHTML=htmlPacotes(nucleo(S.sess.n),ev.target.value);atualizarGuia()}
});
document.addEventListener("input",function(ev){
  var i=ev.target&&ev.target.id;if(i==="f-brl"||i==="f-usd"||i==="f-custom"||i==="f-fator"||/^f-[pv]-/.test(i||""))atualizarGuia();
});
document.addEventListener("click",function(ev){
  var b=ev.target.closest?ev.target.closest("[data-a]"):null;if(!b)return;
  var a=b.getAttribute("data-a");
  if(a==="entrar")entrar(document.getElementById("codigo").value);
  else if(a==="criar"){
    S.ocupado=true;
    Store.gravarConfig({cotacao:COTACAO_PADRAO,marcos:{},criadoEm:Date.now()}).then(function(){S.ocupado=false;S.criar=false;abrir()}).catch(function(e){S.ocupado=false;S.erro=erroRede(e);render()});
  }
  else if(a==="aba"){S.aba=b.getAttribute("data-id");S.erro="";render();window.scrollTo(0,0)}
  else if(a==="marco"){var id=b.getAttribute("data-id"),o={marcos:{}};o.marcos[id]=!(S.cfg.marcos&&S.cfg.marcos[id]===true);Store.gravarConfig(o).catch(function(e){aviso(erroRede(e))})}
  else if(a==="salvar-cot"){var c=parseNum(document.getElementById("cot").value);if(c<1||c>50){aviso("Informe uma cotação válida, como 5,50.");return}document.activeElement&&document.activeElement.blur();Store.gravarConfig({cotacao:c}).then(function(){aviso("Cotação atualizada.")}).catch(function(e){aviso(erroRede(e))})}
  else if(a==="esc-n"){S.fNucleo=b.getAttribute("data-id");S.erro="";render()}
  else if(a==="volta-n"){S.fNucleo=null;S.erro="";render()}
  else if(a==="pin")tratarPin();
  else if(a==="esqueci"){
    if(window.confirm("Criar um novo PIN? Os valores salvos com o PIN antigo não serão recuperados, e vocês precisarão digitá-los de novo. O percentual e as medalhas continuam.")){
      Store.gravarProg(S.fNucleo,{pinTag:firebaseApagarTag(),atualizadoEm:Date.now()}).then(function(){S.prog[S.fNucleo]=deepMerge(S.prog[S.fNucleo]||{},{pinTag:""});S.erro="";render()}).catch(function(e){S.erro=erroRede(e);render()});
    }
  }
  else if(a==="salvar")salvarValores();
  else if(a==="doc")alternarDoc(b.getAttribute("data-p"),b.getAttribute("data-c"));
  else if(a==="sair-nucleo"){lsDel("orl_sess_"+S.chave);S.sess=null;S.priv=null;S.plano=null;S.fNucleo=null;S.erro="";render()}
  else if(a==="sair-painel"){if(window.confirm("Sair deste aparelho? Para voltar, será preciso digitar o código da família e o PIN.")){lsDel("orl_cod");lsDel("orl_sess_"+S.chave);location.href=location.href.split("#")[0]}}
  else if(a==="convidar")convidar();
  else if(a==="recarregar")location.reload();
});

document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.tela==="app")renderSeguro()});
